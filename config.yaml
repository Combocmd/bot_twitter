scheduling:
  active_hours_start: 0
  active_hours_end: 24
  timezone: "Europe/Madrid"
  max_tweets_per_day: 80
  original_tweets_per_day: 80
  min_interval_minutes: 0
  max_interval_minutes: 0
  jitter_minutes: 0

length:
  max_chars: 280

deduplication:
  content_similarity_threshold: 0.82
  time_window_hours: 48
  exact_hash_check: true

logging:
  level: "INFO"
  file: "logs/bot.log"
  max_bytes: 10485760
  backup_count: 5
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"

database:
  path: "data/bot.db"

match_calendar:
  enabled: true
  refresh_hours: 6
  cache_file: "data/barca_matches.json"
  before_minutes: 15
  after_minutes: 45
  timezone: "Europe/Madrid"

media:
  enabled: true
  max_size_mb: 5
  max_video_size_mb: 50
  timeout_seconds: 45
  cache_dir: "data/media_cache"
  max_images_per_tweet: 4
  max_media_per_tweet: 4

vision:
  enabled: true
  model_priority:
    - "moondream:2b"      # Fastest (~2-5s per image) - if available
    - "llava:3b"          # Fast (~5-10s per image) - if available
    - "llava:7b"          # Balanced (~15-30s per image) - currently available
    - "bakllava:7b"
  max_frames_per_video: 1  # Single frame for speed
  timeout_seconds: 60
  importance_boost_enabled: true
  min_importance_for_vision: 0.2  # Only run vision if text importance >= this
  # Speed optimizations
  max_image_size: 336      # Resize images to max 336px (LLaVA native resolution)
  num_predict: 200         # Max tokens for vision response (complete structured output)
  temperature: 0.1         # Low temperature for consistent analysis
