# Configuration du Bot Twitter @UniversCule (Média Barça)
# Toutes les valeurs sensibles sont dans .env

twitter: {}

# Publication gratuite via la session web @UniversCule (pas d'API payante)
x_web:
  state_file: "data/x_universcule_state.json"
  profile_dir: "data/x_universcule_profile"
  expected_handle: "UniversCule"
  headless: true
  timeout_seconds: 45

# Lecture publique via la session Firefox @XenoSama__ (cookies importés)
x_reader:
  state_file: "data/x_reader_state.json"
  headless: true
  timeout_seconds: 45

ollama:
  host: "http://localhost:11434"
  model: "qwen2.5:7b"
  timeout_seconds: 60
  temperature: 0.75

embeddings:
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  similarity_threshold: 0.82
  batch_size: 32

# Traduction locale dédiée pour les sources arabes (NLLB), puis réécriture Ollama
translation:
  enabled: true
  model_name: "facebook/nllb-200-distilled-600M"
  max_new_tokens: 220
  num_beams: 3

sources:
  accounts:
    - "Forca_Fcb"
    - "BarcaTimes"
    - "ReshadRahman"
    - "BarcaUniversal"
    - "Barca_buzz"
    - "barcacentre"
    - "FCBarcelona"
  # RSS feeds for sources that have them (free alternative to Twitter API)
  rss_feeds:
    BarcaUniversal: "https://barcauniversal.com/feed/"

polling:
  # Veille chaque minute; seuls les contenus âgés de 2 minutes maximum sont acceptés.
  interval_minutes: 1
  lookback_minutes: 2
  max_results_per_source: 20
  max_candidates_per_cycle: 60

