# Configuration du Bot Twitter @UniverseCule (Média Barça International)

twitter: {}

x_web:
  state_file: "data/x_universecule_state.json"
  profile_dir: "data/x_universecule_profile"
  expected_handle: "UniverseCule"
  headless: true
  timeout_seconds: 45

x_reader:
  state_file: "data/x_reader_state.json"
  headless: true
  timeout_seconds: 60

ollama:
  host: "http://localhost:11434"
  model: "qwen2.5:7b"
  timeout_seconds: 45
  temperature: 0.20

embeddings:
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  similarity_threshold: 0.82
  batch_size: 32

sources:
  accounts:
    - "Forca_Fcb"
    - "BarcaTimes"
    - "ReshadRahman"
    - "BarcaUniversal"
    - "Barca_buzz"
    - "barcacentre"
    - "FCBarcelona"
    - "FabrizioRomano"
    - "_BarcaInfo"
    - "MesBlaugrana"
    - "BarcaNewsFRA"
    - "Barca_Archive"
  rss_feeds:
    BarcaUniversal: "https://barcauniversal.com/feed/"

polling:
  interval_minutes: 1
  lookback_minutes: 2
  max_results_per_source: 20
  max_candidates_per_cycle: 60

