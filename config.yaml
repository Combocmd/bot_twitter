scheduling:
  active_hours_start: 0
  active_hours_end: 24
  timezone: "Europe/Madrid"
  # Plafond configuré du compte : 80 posts originaux maximum par jour
  max_tweets_per_day: 80
  original_tweets_per_day: 80
  # Publication immédiate dès qu'un contenu est validé.
  min_interval_minutes: 0
  max_interval_minutes: 0
  jitter_minutes: 0

replies:
  # Les réponses automatiques sont désactivées : elles seront faites manuellement.
  enabled: false
  check_interval_minutes: 5
  min_delay_minutes: 20
  max_delay_minutes: 30
  relevance_threshold: 0.6
  language: "fr"
  max_replies_per_day: 15
  max_tweets_to_check: 8
  max_age_hours: 48
  min_comment_length: 4

length:
  max_chars: 280

deduplication:
  content_similarity_threshold: 0.82
  time_window_hours: 48
  exact_hash_check: true

logging:
  level: "INFO"
  file: "logs/bot.log"
  max_bytes: 10485760
  backup_count: 5
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"

database:
  path: "data/bot.db"

match_calendar:
  enabled: true
  refresh_hours: 6
  cache_file: "data/barca_matches.json"
  before_minutes: 15
  after_minutes: 45
  timezone: "Europe/Madrid"

media:
  enabled: true
  max_size_mb: 5
  max_video_size_mb: 50
  timeout_seconds: 60
  cache_dir: "data/media_cache"
  max_images_per_tweet: 4
  max_media_per_tweet: 4